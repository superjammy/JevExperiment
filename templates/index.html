<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classify Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    background: #ffffff;
    border-bottom: 1px solid #e0e0e0;
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #0a84ff;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #e5e5ea;
    color: #1c1c1e;
    border-bottom-left-radius: 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #ffffff;
    border-top: 1px solid #e0e0e0;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d0d5;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #0a84ff;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>Classify Chat</header>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" placeholder="Describe an issue..." autocomplete="off">
  <button type="submit" id="send">Send</button>
</form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/classify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state: text }),
      });
      const data = await res.json();
      if (!res.ok) {
        addMessage('Error: ' + (data.error || res.status), 'bot');
      } else if (data.response) {
        addMessage(data.response, 'bot');
      } else {
        addMessage('Department: ' + data.department, 'bot');
      }
    } catch (err) {
      addMessage('Error: request failed', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
